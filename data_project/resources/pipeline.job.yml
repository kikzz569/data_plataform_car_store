# Este job sera ampliado nas proximas entregas. DAG previsto:
# raw_conferencia -> bronze_ingestao -> silver (tarefas paralelas) ->
# gold/dimensoes/fatos/marts/testes -> ML/listas -> consumo e piloto.
resources:
  jobs:
    concessionaria_pipeline:
      name: concessionaria_pipeline
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 8 * * ?"
        timezone_id: America/Sao_Paulo
      parameters:
        - name: catalog
          default: ${var.catalog}
      tasks:
        - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/raw/conferencia.py
            source: WORKSPACE
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
          # A ausencia de configuracao de cluster seleciona compute serverless.

        - task_key: bronze_ingestao
          depends_on:
            - task_key: raw_conferencia
          run_if: ALL_SUCCESS
          notebook_task:
            notebook_path: ../src/bronze/ingestao.py
            source: WORKSPACE
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
          # A ausencia de configuracao de cluster seleciona compute serverless.

        # As tres tarefas Silver ficam no mesmo nivel do DAG, sem dependencias entre si.
        - task_key: silver_crm
          depends_on:
            - task_key: bronze_ingestao
          run_if: ALL_SUCCESS
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/crm.sql
              source: WORKSPACE

        - task_key: silver_erp
          depends_on:
            - task_key: bronze_ingestao
          run_if: ALL_SUCCESS
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/erp.sql
              source: WORKSPACE

        - task_key: silver_estoque
          depends_on:
            - task_key: bronze_ingestao
          run_if: ALL_SUCCESS
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/estoque.sql
              source: WORKSPACE

        - task_key: gold_dimensoes
          depends_on:
            - task_key: silver_crm
            - task_key: silver_erp
            - task_key: silver_estoque
          run_if: ALL_SUCCESS
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/05-dimensoes.sql
              source: WORKSPACE

        - task_key: gold_fato_vendas
          depends_on:
            - task_key: gold_dimensoes
          run_if: ALL_SUCCESS
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/06-fato-vendas.sql
              source: WORKSPACE

        - task_key: gold_marts
          depends_on:
            - task_key: gold_fato_vendas
          run_if: ALL_SUCCESS
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/07-marts.sql
              source: WORKSPACE

        - task_key: testes
          depends_on:
            - task_key: gold_marts
          run_if: ALL_SUCCESS
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/08-testes.sql
              source: WORKSPACE
