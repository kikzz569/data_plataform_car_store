# Declarative Automation Bundle for the dealership data platform.
bundle:
  name: data_project
  uuid: ceb06508-9103-482a-8a3e-aad5dc01937c

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog used by the data platform.
    default: lakehouse
  warehouse_id:
    description: Existing serverless SQL warehouse used by Silver SQL tasks.
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  dev:
    default: true
    # Do not use mode: development here: it prefixes UC schema names and breaks
    # the stable lakehouse.bronze/silver/gold identifiers used by downstream SQL.
    presets:
      trigger_pause_status: PAUSED
    workspace:
      host: https://dbc-3c3f7029-cdd9.cloud.databricks.com
    variables:
      catalog: lakehouse
  prod:
    mode: production
    workspace:
      host: https://dbc-3c3f7029-cdd9.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/manussteste07@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/manussteste07@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: lakehouse
    permissions:
      - user_name: manussteste07@gmail.com
        level: CAN_MANAGE
