# This is a Declarative Automation Bundle definition for data_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: data_project
  uuid: ceb06508-9103-482a-8a3e-aad5dc01937c

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-3c3f7029-cdd9.cloud.databricks.com
    variables:
      catalog: lakehouse
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-3c3f7029-cdd9.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/manussteste07@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/manussteste07@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: lakehouse
      schema: prod
    permissions:
      - user_name: manussteste07@gmail.com
        level: CAN_MANAGE
